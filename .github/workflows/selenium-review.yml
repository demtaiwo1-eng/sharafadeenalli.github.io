name: Chromium and Selenium browser review

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selenium-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-review:
    name: Chromium UI review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install stable Chromium
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Install Selenium
        run: python -m pip install --upgrade pip && pip install -r requirements-test.txt

      - name: Start local website
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/sarafadeen-http.log 2>&1 &
          echo $! > /tmp/sarafadeen-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sarafadeen-http.log
          exit 1

      - name: Review site with Selenium in headless Chromium
        env:
          WEBSITE_URL: http://127.0.0.1:4173/
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Upload browser review screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-review-evidence
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
